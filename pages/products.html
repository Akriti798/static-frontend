<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frookoon | Products</title>

  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <header class="header">
    <div class="logo" >
      <img
        src="../images/Untitled_design__1_-removebg-preview.webp"
        alt="Frookoon Logo"
        loading="lazy"
      />
    </div>

    <nav class="nav">
      <a href="home.html">Home</a>
      <a href="products.html">Stores</a>
    </nav>

    <div class="profile">
      <img
        src="../images/user-icon-icon_1076610-59410.avif"
        alt="User Profile"
        loading="lazy"
      />
      <span>User</span>
    </div>
  </header>

  <section class="page">
    <h2>Available Products</h2>

    <div class="product-grid">
      <div class="product-card card">
        <h3>Milk</h3>
        <p class="price">₹70/litre</p>
        <p class="status available">Available</p>
      </div>

      <div class="product-card card">
        <h3>Bread</h3>
        <p class="price">₹30</p>
        <p class="status available">Available</p>
      </div>

      <div class="product-card card">
        <h3>Rice</h3>
        <p class="price">₹60/kg</p>
        <p class="status available">Available</p>
      </div>

      <div class="product-card card">
        <h3>Cooking Oil</h3>
        <p class="price">₹120/litre</p>
        <p class="status unavailable">Out of Stock</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>© 2025 Frookoon. All rights reserved.</p>
  </footer>

</body>
</html>
